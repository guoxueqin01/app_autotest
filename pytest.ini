[pytest]
addopts =
    -v
    -ra
    --strict-markers
    --reruns=2
    --reruns-delay=2
    --alluredir=./allure-results
    --clean-alluredir
    --maxfail=5
markers =
    android: Android 平台用例
    ios: iOS 平台用例
    harmony: 鸿蒙平台用例
    smoke: 冒烟测试用例
    regression: 回归测试用例
    login: 登录功能
    search: 搜索功能
    cart: 购物车功能
    order: 订单功能
    profile: 个人中心功能
    slow: 耗时较长的用例
    data: 测试数据文件标记
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
log_cli = true
log_cli_level = INFO
